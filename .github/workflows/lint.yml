name: Lint & Bundle

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: ESLint + bundle assertions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dev dependencies
        run: npm install --no-audit --no-fund

      - name: ESLint
        run: npm run lint

      - name: Build bundle
        run: npm run build

      - name: Bundle assertions
        run: python3 scripts/check_bundle.py
